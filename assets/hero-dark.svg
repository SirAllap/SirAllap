<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif} .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;font-size:18px} .name{font-size:40px;font-weight:640;letter-spacing:-.9px;fill:#e6edf3; animation:rise .9s cubic-bezier(.2,.8,.2,1) both} .prompt{fill:#2dd4bf;animation:rise .9s .18s cubic-bezier(.2,.8,.2,1) both} .typed{fill:#e6edf3} .meta{font-size:11px;letter-spacing:2.4px;fill:#7d8590;font-weight:500; animation:rise .9s .34s cubic-bezier(.2,.8,.2,1) both} .handle{font-size:14px;letter-spacing:.6px;fill:#9198a1;text-anchor:end; animation:rise .9s .26s cubic-bezier(.2,.8,.2,1) both} .rule{stroke:#30363d;stroke-width:1;stroke-dasharray:880; stroke-dashoffset:880;animation:draw 1.5s .1s cubic-bezier(.2,.8,.2,1) forwards} .lane{stroke:#30363d;stroke-width:1} .dot{fill:#2dd4bf} .caret{fill:#2dd4bf; animation:caret 21.0s infinite,blink 1.06s steps(1) infinite} @keyframes t0{0%{width:0.0px;animation-timing-function:steps(24,end)}8.571%{width:259.2px}26.667%{width:259.2px;animation-timing-function:steps(24,end)}30.476%{width:0.0px;animation-timing-function:steps(24,end)}100%{width:0.0px;animation-timing-function:steps(24,end)}}@keyframes t1{0%{width:0.0px;animation-timing-function:steps(39,end)}33.333%{width:0.0px;animation-timing-function:steps(39,end)}41.905%{width:421.2px}60.000%{width:421.2px;animation-timing-function:steps(39,end)}63.810%{width:0.0px;animation-timing-function:steps(39,end)}100%{width:0.0px;animation-timing-function:steps(39,end)}}@keyframes t2{0%{width:0.0px;animation-timing-function:steps(34,end)}66.667%{width:0.0px;animation-timing-function:steps(34,end)}75.238%{width:367.2px}93.333%{width:367.2px;animation-timing-function:steps(34,end)}97.143%{width:0.0px;animation-timing-function:steps(34,end)}} .rv{animation-duration:21.0s;animation-iteration-count:infinite} .rv0{animation-name:t0}.rv1{animation-name:t1}.rv2{animation-name:t2} @keyfra