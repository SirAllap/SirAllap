<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil GitHub · maqueta</title>
<style>
  :root {
    --shell: #010409; --card: #0d1117; --bar: #0d1117cc;
    --fg: #e6edf3; --muted: #9198a1; --faint: #7d8590;
    --line: #3d444d; --hair: #21262d; --subtle: #151b23;
    --link: #4493f8; --code: #656c7633; --accent: #2dd4bf;
    --shadow: 0 1px 0 rgba(0,0,0,.6), 0 12px 40px -12px rgba(0,0,0,.8);
  }
  html[data-theme="light"] {
    --shell: #eef0f4; --card: #ffffff; --bar: #ffffffcc;
    --fg: #1f2328; --muted: #59636e; --faint: #818b98;
    --line: #d1d9e0; --hair: #e6eaef; --subtle: #f6f8fa;
    --link: #0969da; --code: #818b981f; --accent: #0d9488;
    --shadow: 0 1px 0 rgba(31,35,40,.04), 0 16px 40px -16px rgba(31,35,40,.24);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--shell); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
          Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- barra superior ---- */
  .top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 12px 24px; background: var(--bar);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--hair);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand b { font-size: 14px; letter-spacing: -.2px; }
  .brand span {
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--faint);
  }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--subtle);
          border: 1px solid var(--hair); border-radius: 10px; }
  .tab {
    display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    padding: 6px 14px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--muted); font: inherit; line-height: 1.2;
    transition: background .15s, color .15s;
  }
  .tab span { font-size: 13px; font-weight: 600; }
  .tab em {
    font-style: normal; font-size: 10px; letter-spacing: .7px;
    text-transform: uppercase; opacity: .7;
  }
  .tab:hover { color: var(--fg); }
  .tab.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
  .tab.on em { color: var(--accent); opacity: 1; }
  .toggle {
    padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--subtle); color: var(--muted); font: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .toggle:hover { color: var(--fg); border-color: var(--accent); }

  /* ---- paneles ---- */
  .panel { display: none; gap: 28px; padding: 28px 24px 72px; align-items: start; }
  .panel.on { display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
  @media (max-width: 1180px) { .panel.on { grid-template-columns: minmax(0, 1fr); } }

  .frame {
    max-width: 1012px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }
  .frame-bar {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 16px; border-bottom: 1px solid var(--hair); background: var(--subtle);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .frame-path {
    margin-left: 10px; font-size: 12px; color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .frame-path b { color: var(--muted); font-weight: 600; }

  /* ---- notas ---- */
  .rail { position: sticky; top: 84px; }
  .rail-lead {
    margin: 0 0 18px; padding-left: 14px; border-left: 2px solid var(--accent);
    font-size: 14px; color: var(--fg);
  }
  .note { padding: 14px 0; border-top: 1px solid var(--hair); }
  .note h4 { margin: 0 0 5px; font-size: 13px; font-weight: 650; }
  .note p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
  .note code {
    padding: .15em .35em; border-radius: 5px; background: var(--code); font-size: 90%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .foot {
    grid-column: 1 / -1; margin-top: 8px; padding-top: 18px;
    border-top: 1px solid var(--hair); font-size: 13px; color: var(--muted);
  }
  .foot code {
    padding: .2em .45em; border-radius: 6px; background: var(--code);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* ---- conmutador de tema para <picture> ---- */
  html[data-theme="dark"] .only-light,
  html[data-theme="light"] .only-dark { display: none; }

  /* ---- markdown, calcado de GitHub ---- */
  .markdown-body {
    padding: 32px; font-size: 16px; line-height: 1.5; word-wrap: break-word;
  }
  .markdown-body > *:first-child { margin-top: 0 !important; }
  .markdown-body > *:last-child { margin-bottom: 0 !important; }
  .markdown-body p { margin: 0 0 16px; }
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4 { margin: 24px 0 16px; font-weight: 600; line-height: 1.25; }
  .markdown-body h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--hair); }
  .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--hair); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1em; }
  .markdown-body hr {
    height: .25em; margin: 24px 0; padding: 0; border: 0; background: var(--hair);
  }
  .markdown-body img { max-width: 100%; vertical-align: middle; }
  .markdown-body code {
    padding: .2em .4em; margin: 0; font-size: 85%; border-radius: 6px;
    background: var(--code);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .markdown-body ul, .markdown-body ol { margin: 0 0 16px; padding-left: 2em; }
  .markdown-body li { margin-top: .25em; }
  .markdown-body details { margin-bottom: 16px; }
  .markdown-body summary { cursor: pointer; }
  .markdown-body summary:hover { color: var(--link); }
  .markdown-body sub { font-size: 12px; color: var(--muted); }
  .markdown-body blockquote {
    margin: 0 0 16px; padding: 0 1em; color: var(--muted);
    border-left: .25em solid var(--line);
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Perfil de GitHub</b><span>maqueta</span></div>
  <div class="tabs"><!--TABS--></div>
  <button class="toggle" id="theme">Tema: oscuro</button>
</header>

<main id="main">
<!--PANELS-->
</main>

<script>
  const main = document.getElementById('main');
  const show = (id) => {
    document.querySelectorAll('.panel').forEach(p =>
      p.classList.toggle('on', p.dataset.variant === id));
    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('on', t.dataset.go === id));
    window.scrollTo({ top: 0 });
  };
  document.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => show(t.dataset.go)));
  show('<!--FIRST-->');

  const btn = document.getElementById('theme');
  btn.addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    btn.textContent = dark ? 'Tema: claro' : 'Tema: oscuro';
  });
</script>
</body>
</html>
